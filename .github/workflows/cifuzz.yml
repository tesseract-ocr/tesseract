name: CIFuzz
# OSS-Fuzz CI
# See https://google.github.io/oss-fuzz/getting-started/continuous-integration/
on:
  pull_request:
    branches:
    - main
    paths:
    - '**.cpp'
    - '**.h'
jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    steps:
    - name: Build Fuzzers
      id: build
      # Pinned to the oss-fuzz commit of 2026-11-17: a moving branch ref lets
      # upstream code run in this repository's workflow without review.
      uses: google/oss-fuzz/infra/cifuzz/actions/build_fuzzers@f9894b9e4f0c69c12c551aee4a4e08b08885a980
      with:
        oss-fuzz-project-name: 'tesseract-ocr'
        language: c++
        dry-run: false
    - name: Run Fuzzers
      uses: google/oss-fuzz/infra/cifuzz/actions/run_fuzzers@f9894b9e4f0c69c12c551aee4a4e08b08885a980
      with:
        oss-fuzz-project-name: 'tesseract-ocr'
        fuzz-seconds: 600
        dry-run: false
    - name: Upload Crash
      uses: actions/upload-artifact@v7
      if: failure() && steps.build.outcome == 'success'
      with:
        name: artifacts
        path: ./out/artifacts
