# NOT TESTED in this repo: a starting point. Needs nginx >= 1.25 (HTTP/3) and, for the *_static lines, the
# ngx_brotli and zstd-nginx-module modules (gzip_static is built in).
upstream ocr_api {
    server 127.0.0.1:4000;
    keepalive 32;
    keepalive_timeout 60s;       # idle upstream sockets are closed by nginx after 60 s ...
    # ... so Node's keepAliveTimeout (65 s) and headersTimeout (66 s) are deliberately LONGER. If Node closed first,
    # nginx would occasionally reuse a socket Node just killed and return 502.
}

server {
    listen 443 ssl;
    listen 443 quic reuseport;
    http2 on;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    server_name ocr.example.com;
    ssl_certificate     /etc/letsencrypt/live/ocr.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ocr.example.com/privkey.pem;

    client_max_body_size 25m;    # a bit above MAX_UPLOAD_MB; nginx rejects oversize bodies before Node sees a byte

    # Static front-end: nginx serves the .zst/.br/.gz files made by `npm run build:public` straight from disk.
    # Node is not involved and no CPU is spent compressing.
    location / {
        root /srv/vegeocr/public;
        gzip_static on;
        brotli_static on;
        zstd_static on;
        location ~ \.[0-9a-f]{8,}\.(js|css)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
        location = /index.html               { add_header Cache-Control "no-cache"; }
    }

    # API: Node negotiates zstd/br/gzip itself and serves cached, pre-compressed variants, so nginx must not compress.
    location /api/ {
        gzip off;                # (nginx would skip responses that already carry Content-Encoding anyway)
        proxy_pass http://ocr_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;     # Node logs and echoes it
        proxy_request_buffering on;                    # slow uploaders are absorbed by nginx, not by an OCR-serving Node
        proxy_read_timeout 150s;                       # > REQUEST_TIMEOUT_MS (130 s)
    }

    # Server-Sent Events: never buffer, allow long-lived connections.
    location ~ ^/api/ocr/[^/]+/events$ {
        proxy_pass http://ocr_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        gzip off;
    }

    location = /metrics { allow 10.0.0.0/8; deny all; proxy_pass http://ocr_api; }   # Prometheus only, never public
}
