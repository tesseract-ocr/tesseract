name: vegeocr

x-backend: &backend
  build:
    context: ..
    dockerfile: vegeocr-platform/backend/Dockerfile
    args:
      INSTALL_HANDWRITING: ${INSTALL_HANDWRITING:-0}   # 1 = include the TrOCR handwriting engine (large)
  environment: &backend-env
    ENABLE_HANDWRITING: ${ENABLE_HANDWRITING:-0}
    DATABASE_URL: postgresql+psycopg://vegeocr:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/vegeocr
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    CORS_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:3000}
    RETRAIN_THRESHOLD: ${RETRAIN_THRESHOLD:-50}
    RETRAIN_SCHEDULE_HOURS: ${RETRAIN_SCHEDULE_HOURS:-24}
  volumes:
    - appdata:/data
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vegeocr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vegeocr
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vegeocr"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  api:
    <<: *backend
    ports: ["8000:8000"]
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:8000/health"], interval: 10s, retries: 30, start_period: 60s }

  # OCR for big files + training + the auto-retrain timer (beat). Run ONE of these (it embeds the scheduler).
  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker.celery_app.celery", "worker", "-B", "-Q", "ocr,training,celery", "-c", "2", "-l", "info"]
    depends_on:
      api: { condition: service_healthy }

  # Next.js server: internal only; the edge below is what browsers talk to.
  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on: [api]

  # Edge (Caddy): serves pre-compressed static assets from disk, compresses HTML on the fly, proxies the rest to Next.
  edge:
    build:
      context: ./frontend
      target: edge
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [frontend]

volumes:
  pgdata:
  appdata:
